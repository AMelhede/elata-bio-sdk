name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

# A new push to the same branch/PR cancels the superseded run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  PNPM_VERSION: 10.31.0

jobs:
  rust-lint:
    name: Rust lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-lint
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust test (linux, workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-test
      - run: cargo test --workspace --all-targets

  build-wasm:
    name: Build WASM targets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-wasm
      - name: Install wasm-bindgen CLI (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli
      - run: cargo build -p eeg-wasm --target wasm32-unknown-unknown --release
      - run: cargo build -p rppg-wasm --target wasm32-unknown-unknown --release
      - name: Run wasm-bindgen for eeg
        run: |
          wasm-bindgen target/wasm32-unknown-unknown/release/eeg_wasm.wasm \
            --out-dir eeg-demo/pkg --target web
      - name: Sync eeg WASM into eeg-web package
        run: bash packages/eeg-web/scripts/sync-wasm.sh
      - name: Run wasm-bindgen for rppg
        run: |
          wasm-bindgen target/wasm32-unknown-unknown/release/rppg_wasm.wasm \
            --out-dir packages/rppg-web/demo/pkg --target web
      - uses: actions/upload-artifact@v4
        with:
          name: eeg-wasm-pkg
          path: packages/eeg-web/wasm/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: rppg-wasm-pkg
          path: packages/rppg-web/demo/pkg/
          retention-days: 1

  web:
    name: Web packages (lint, test, build, pack, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-wasm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-wasm
      - name: Install wasm-bindgen CLI (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli
      - uses: actions/download-artifact@v4
        with:
          name: eeg-wasm-pkg
          path: packages/eeg-web/wasm
      - uses: actions/download-artifact@v4
        with:
          name: rppg-wasm-pkg
          path: packages/rppg-web/demo/pkg
      - run: pnpm install --frozen-lockfile
      # Clippy already ran in rust-lint; do not run `pnpm lint` (it re-runs it).
      - name: Repo audit, format check, web lint
        run: pnpm run audit:repo && pnpm run format:check && pnpm run lint:web
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/validate-tarballs.mjs
      - name: Dry-run pack all packages
        run: |
          for pkg in packages/eeg-web packages/eeg-web-ble packages/rppg-web packages/create-elata-demo; do
            echo "--- $pkg ---"
            (cd $pkg && pnpm pack --dry-run --json)
          done
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --dir packages/rppg-web exec playwright install --with-deps chromium
      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --dir packages/rppg-web exec playwright install-deps chromium
      - run: pnpm --dir packages/rppg-web run ci:e2e

  consumer-smoke:
    name: Consumer smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-wasm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-wasm
      - name: Install wasm-bindgen CLI (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli
      - uses: actions/download-artifact@v4
        with:
          name: eeg-wasm-pkg
          path: packages/eeg-web/wasm
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke:consumers
